query StaffBookings @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") {
  bookings(orderBy: [{ createdAt: DESC }], limit: 100) {
    id
    reference
    status
    passengerCount
    total
    serviceFee
    paymentStatus
    paymentMethod
    paidAt
    bookingChannel
    createdAt
    owner { fullName email phone }
    sailing { code departureAt origin { name } destination { name } vessel { name } }
    bookingPassengers_on_booking { fullName passengerType fare ticketCode ticketStatus }
  }
}

query TicketingPassengerAccounts @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") {
  users(where: { role: { eq: "PASSENGER" } }, orderBy: [{ fullName: ASC }], limit: 500) {
    uid fullName email
  }
}

query TicketingSailings @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") {
  sailings(where: { status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" }, availableSeats: { ge: 1 } }, orderBy: [{ departureAt: ASC }], limit: 100) {
    code departureAt availableSeats regularFare studentFare seniorFare childFare pwdFare
    origin { name } destination { name } vessel { name }
  }
}

mutation CollectBookingPayment($bookingId: UUID!, $method: String!) @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.bookings.size() == 1 && vars.method == 'CASH'", message: "Booking must be unpaid, active, and have a valid payment method.") {
    bookings(where: { id: { eq: $bookingId }, status: { in: ["PENDING", "CONFIRMED"] }, paymentStatus: { eq: "UNPAID" }, sailing: { departureAt: { gt_expr: "request.time" }, status: { in: ["SCHEDULED", "BOARDING"] } } }) { id ownerUid reference passengerCount }
  }
  booking_update(first: { where: { id: { eq: $bookingId }, paymentStatus: { eq: "UNPAID" }, status: { in: ["PENDING", "CONFIRMED"] } } }, data: {
    status: "CONFIRMED"
    paymentStatus: "PAID"
    paymentMethod: $method
    paidAt_expr: "request.time"
    collectedByUid_expr: "auth.uid"
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "Payment was already recorded or booking changed.")
  bookingPassenger_updateMany(where: { bookingId: { eq: $bookingId }, ticketStatus: { eq: "PENDING" } }, data: { ticketStatus: "ISSUED", issuedAt_expr: "request.time" })
  notification_insert(data: {
    ownerUid_expr: "response.query.bookings[0].ownerUid"
    title: "Payment received"
    message: "Payment recorded. Your passenger e-tickets are ready in My Bookings."
    category: "BOOKING"
  })
}

mutation TicketingCreateWalkIn($sailingCode: String!, $ownerUid: String!, $reference: String!, $passengerName: String!, $passengerType: String!, $method: String!) @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && response.query.users.size() == 1 && vars.method == 'CASH' && (vars.passengerType == 'REGULAR' || vars.passengerType == 'STUDENT' || vars.passengerType == 'SENIOR' || vars.passengerType == 'CHILD' || vars.passengerType == 'PWD')", message: "Choose an active sailing, passenger account, fare type, and cash payment.") {
    sailings(where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" }, availableSeats: { ge: 1 } }) { regularFare studentFare seniorFare childFare pwdFare }
    users(where: { uid: { eq: $ownerUid }, role: { eq: "PASSENGER" } }) { uid }
  }
  sailing_update(first: { where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, availableSeats: { ge: 1 } } }, data: { availableSeats_update: { dec: 1 }, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "No seats left on this sailing.")
  booking_insert(data: {
    reference: $reference ownerUid: $ownerUid sailingCode: $sailingCode
    bookingChannel: "WALK_IN" status: "CONFIRMED" paymentStatus: "PAID"
    paymentMethod: $method paidAt_expr: "request.time" collectedByUid_expr: "auth.uid"
    passengerCount: 1 serviceFee: 0
    passengerFareTotal_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
    total_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
  bookingPassenger_insert(data: {
    bookingId_expr: "response.booking_insert.id" fullName: $passengerName passengerType: $passengerType
    fare_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
    ticketStatus: "ISSUED" issuedAt_expr: "request.time"
  })
  notification_insert(data: { ownerUid: $ownerUid title: "Walk-in ticket issued" message: "Your walk-in ticket is ready in My Bookings." category: "BOOKING" })
}

mutation TicketingCreateGuestWalkIn($sailingCode: String!, $guestUid: String!, $guestEmail: String!, $reference: String!, $ticketCode: UUID!, $passengerName: String!, $passengerPhone: String, $birthDate: Date, $sex: String, $nationality: String, $passengerType: String!, $method: String!) @auth(expr: "auth.token.role == 'TICKETING' || auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && vars.method == 'CASH' && (vars.passengerType == 'REGULAR' || vars.passengerType == 'STUDENT' || vars.passengerType == 'SENIOR' || vars.passengerType == 'CHILD' || vars.passengerType == 'PWD')", message: "Choose an active sailing, fare type, and cash payment.") {
    sailings(where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" }, availableSeats: { ge: 1 } }) { regularFare studentFare seniorFare childFare pwdFare }
  }
  guest: user_insert(data: { uid: $guestUid, email: $guestEmail, fullName: $passengerName, phone: $passengerPhone, role: "WALK_IN" })
  sailing_update(first: { where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, availableSeats: { ge: 1 } } }, data: { availableSeats_update: { dec: 1 }, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "No seats left on this sailing.")
  booking_insert(data: {
    reference: $reference ownerUid: $guestUid sailingCode: $sailingCode
    bookingChannel: "WALK_IN" status: "CONFIRMED" paymentStatus: "PAID"
    paymentMethod: $method paidAt_expr: "request.time" collectedByUid_expr: "auth.uid"
    passengerCount: 1 serviceFee: 0
    passengerFareTotal_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
    total_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
  bookingPassenger_insert(data: {
    bookingId_expr: "response.booking_insert.id" fullName: $passengerName passengerType: $passengerType ticketCode: $ticketCode
    birthDate: $birthDate sex: $sex phone: $passengerPhone nationality: $nationality
    fare_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
    ticketStatus: "ISSUED" issuedAt_expr: "request.time"
  })
}

query BoardingManifest($sailingCode: String!) @auth(expr: "auth.token.role == 'BOARDING' || auth.token.role == 'ADMIN'") {
  bookings(where: { sailingCode: { eq: $sailingCode }, status: { eq: "CONFIRMED" }, paymentStatus: { eq: "PAID" } }, orderBy: [{ createdAt: ASC }]) {
    reference
    owner { fullName }
    sailing { code departureAt }
    bookingPassengers_on_booking {
      fullName
      passengerType
      id
      ticketCode
      ticketStatus
      booking { paymentStatus status }
      checkedInAt
      boardedAt
    }
  }
}

query BoardingSailings @auth(expr: "auth.token.role == 'BOARDING' || auth.token.role == 'ADMIN'") {
  sailings(where: { status: { in: ["SCHEDULED", "BOARDING"] } }, orderBy: [{ departureAt: ASC }], limit: 100) {
    code
    status
    departureAt
    origin { name }
    destination { name }
    vessel { name }
  }
}

query BoardingActivity($sailingCode: String!) @auth(expr: "auth.token.role == 'BOARDING' || auth.token.role == 'ADMIN'") {
  boardingEvents(where: { passenger: { booking: { sailingCode: { eq: $sailingCode } } } }, orderBy: [{ createdAt: DESC }], limit: 30) {
    id eventType createdAt staffUid
    passenger { fullName booking { reference } }
  }
}

mutation CheckInTicket($passengerId: UUID!) @auth(expr: "auth.token.role == 'BOARDING' || auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.bookingPassengers.size() == 1 && (response.query.bookingPassengers[0].booking.sailing.status == 'BOARDING' || response.query.bookingPassengers[0].booking.sailing.departureAt > request.time)", message: "Only paid, confirmed tickets on active sailings can check in.") {
    bookingPassengers(where: { id: { eq: $passengerId }, ticketStatus: { eq: "ISSUED" }, booking: { status: { eq: "CONFIRMED" }, paymentStatus: { eq: "PAID" }, sailing: { status: { in: ["SCHEDULED", "BOARDING"] } } } }) { id booking { sailing { status departureAt } } }
  }
  bookingPassenger_update(
    first: { where: { id: { eq: $passengerId }, ticketStatus: { eq: "ISSUED" } } }
    data: { ticketStatus: "CHECKED_IN", checkedInAt_expr: "request.time" }
  )
    @check(expr: "this != null", message: "This ticket cannot be checked in again.")
  boardingEvent_insert(data: { passengerId: $passengerId, staffUid_expr: "auth.uid", eventType: "CHECKED_IN" })
}

mutation BoardTicket($passengerId: UUID!) @auth(expr: "auth.token.role == 'BOARDING' || auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.bookingPassengers.size() == 1", message: "Boarding requires a checked-in ticket, a paid confirmed reservation, and a trip with status BOARDING. Set the trip to BOARDING in Trips & schedules before boarding passengers.") {
    bookingPassengers(where: { id: { eq: $passengerId }, ticketStatus: { eq: "CHECKED_IN" }, booking: { status: { eq: "CONFIRMED" }, paymentStatus: { eq: "PAID" }, sailing: { status: { eq: "BOARDING" } } } }) { id }
  }
  bookingPassenger_update(
    first: { where: { id: { eq: $passengerId }, ticketStatus: { eq: "CHECKED_IN" } } }
    data: { ticketStatus: "BOARDED", boardedAt_expr: "request.time" }
  )
    @check(expr: "this != null", message: "This ticket must be checked in before boarding.")
  boardingEvent_insert(data: { passengerId: $passengerId, staffUid_expr: "auth.uid", eventType: "BOARDED" })
}

query AdminSailings @auth(expr: "auth.token.role == 'ADMIN'") {
  sailings(orderBy: [{ departureAt: DESC }], limit: 100) {
    code
    departureAt
    arrivalAt
    availableSeats
    regularFare
    studentFare
    seniorFare
    childFare
    pwdFare
    status
    origin { id name }
    destination { id name }
    vessel { id name passengerCapacity }
  }
}

query AdminDashboardStats($dayStart: Timestamp!, $dayEnd: Timestamp!) @auth(expr: "auth.token.role == 'ADMIN'") {
  todaySailings: sailings(where: { departureAt: { ge: $dayStart, lt: $dayEnd } }) { _count }
  todayBookings: bookings(where: { createdAt: { ge: $dayStart, lt: $dayEnd } }) { _count }
  cancelledBookings: bookings(where: { status: { eq: "CANCELLED" } }) { _count }
  allPassengers: bookingPassengers(where: { booking: { status: { eq: "CONFIRMED" }, paymentStatus: { eq: "PAID" } } }) { _count }
  checkedInPassengers: bookingPassengers(where: { ticketStatus: { in: ["CHECKED_IN", "BOARDED"] } }) { _count }
  boardedPassengers: bookingPassengers(where: { ticketStatus: { eq: "BOARDED" } }) { _count }
}

query AdminUsers @auth(expr: "auth.token.role == 'ADMIN'") {
  users(where: { role: { in: ["PASSENGER", "TICKETING", "BOARDING", "ADMIN"] } }, orderBy: [{ createdAt: DESC }], limit: 100) {
    uid
    email
    fullName
    phone
    role
    createdAt
  }
}

query AdminPassengerRecords @auth(expr: "auth.token.role == 'ADMIN'") {
  bookingPassengers(orderBy: [{ createdAt: DESC }], limit: 1000) {
    id
    fullName
    passengerType
    sex
    ticketCode
    ticketStatus
    checkedInAt
    boardedAt
    createdAt
    booking {
      reference
      status
      paymentStatus
      owner { fullName email }
      sailing { code status departureAt origin { name } destination { name } vessel { name } }
    }
  }
}

query AdminPorts @auth(expr: "auth.token.role == 'ADMIN'") {
  ports(orderBy: [{ name: ASC }], limit: 1000) {
    id code name city region isActive
  }
}

query AdminVessels @auth(expr: "auth.token.role == 'ADMIN'") {
  vessels(orderBy: [{ name: ASC }], limit: 1000) {
    id code name passengerCapacity isActive
  }
}

mutation AdminCreatePort($code: String!, $name: String!, $city: String!, $region: String) @auth(expr: "auth.token.role == 'ADMIN'") {
  port_insert(data: { code: $code, name: $name, city: $city, region: $region })
}

mutation AdminUpdatePort($id: UUID!, $name: String!, $city: String!, $region: String, $isActive: Boolean!) @auth(expr: "auth.token.role == 'ADMIN'") {
  port_update(key: { id: $id }, data: { name: $name, city: $city, region: $region, isActive: $isActive })
}

mutation AdminCreateVessel($code: String!, $name: String!, $capacity: Int!) @auth(expr: "auth.token.role == 'ADMIN'") {
  vessel_insert(data: { code: $code, name: $name, passengerCapacity: $capacity })
}

mutation AdminUpdateVessel($id: UUID!, $name: String!, $capacity: Int!, $isActive: Boolean!) @auth(expr: "auth.token.role == 'ADMIN'") {
  vessel_update(key: { id: $id }, data: { name: $name, passengerCapacity: $capacity, isActive: $isActive })
}

mutation AdminCreateSailing($code: String!, $originPortId: UUID!, $destinationPortId: UUID!, $vesselId: UUID!, $departureAt: Timestamp!, $arrivalAt: Timestamp!, $durationMinutes: Int!, $regularFare: Int!, $studentFare: Int!, $seniorFare: Int!, $childFare: Int!, $pwdFare: Int!) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  codeLock: _execute(sql: "SELECT pg_advisory_xact_lock(4281001)")
  query @check(expr: "response.query.ports.size() == 2 && response.query.vessels.size() == 1 && response.query.fares.size() == 1 && vars.originPortId != vars.destinationPortId && vars.departureAt > request.time && vars.arrivalAt > vars.departureAt && vars.durationMinutes > 0", message: "Select active ports and vessel, save this vessel's fare settings, and use valid future sailing times.") {
    ports(where: { id: { in: [$originPortId, $destinationPortId] }, isActive: { eq: true } }) { id }
    vessels(where: { id: { eq: $vesselId }, isActive: { eq: true } }) { id passengerCapacity }
    fares: fareSettingss(where: { code: { eq_expr: "vars.vesselId" } }) { regularFare studentDiscount seniorDiscount childDiscount pwdDiscount }
    nextTripCode: _selectFirst(sql: """
      WITH day AS (
        SELECT to_char(current_timestamp AT TIME ZONE 'Asia/Manila', '"TRP"YYYY-MMDD') AS prefix
      ), numbered AS (
        SELECT day.prefix, COALESCE(MAX(substring(s.code FROM 13)::bigint), 0) + 1 AS next_number
        FROM day LEFT JOIN sailing s ON s.code ~ ('^' || day.prefix || '[0-9]{3,}$')
        GROUP BY day.prefix
      )
      SELECT prefix || CASE WHEN next_number < 1000 THEN lpad(next_number::text, 3, '0') ELSE next_number::text END AS code
      FROM numbered
    """)
  }
  sailing_insert(data: {
    code_expr: "response.query.nextTripCode.code"
    originPortId: $originPortId
    destinationPortId: $destinationPortId
    vesselId: $vesselId
    departureAt: $departureAt
    arrivalAt: $arrivalAt
    durationMinutes: $durationMinutes
    regularFare_expr: "response.query.fares[0].regularFare"
    studentFare_expr: "((response.query.fares[0].regularFare * (100 - response.query.fares[0].studentDiscount) + 50) / 100) > 0 ? ((response.query.fares[0].regularFare * (100 - response.query.fares[0].studentDiscount) + 50) / 100) : 1"
    seniorFare_expr: "((response.query.fares[0].regularFare * (100 - response.query.fares[0].seniorDiscount) + 50) / 100) > 0 ? ((response.query.fares[0].regularFare * (100 - response.query.fares[0].seniorDiscount) + 50) / 100) : 1"
    childFare_expr: "((response.query.fares[0].regularFare * (100 - response.query.fares[0].childDiscount) + 50) / 100) > 0 ? ((response.query.fares[0].regularFare * (100 - response.query.fares[0].childDiscount) + 50) / 100) : 1"
    pwdFare_expr: "((response.query.fares[0].regularFare * (100 - response.query.fares[0].pwdDiscount) + 50) / 100) > 0 ? ((response.query.fares[0].regularFare * (100 - response.query.fares[0].pwdDiscount) + 50) / 100) : 1"
    availableSeats_expr: "response.query.vessels[0].passengerCapacity"
    status: "SCHEDULED"
  })
}

mutation AdminUpdateSailingStatus($code: String!, $status: String!) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && ((response.query.sailings[0].status == 'SCHEDULED' && (vars.status == 'BOARDING' || vars.status == 'DELAYED')) || (response.query.sailings[0].status == 'DELAYED' && (vars.status == 'SCHEDULED' || vars.status == 'BOARDING')) || (response.query.sailings[0].status == 'BOARDING' && vars.status == 'COMPLETED'))", message: "This sailing status change is not allowed.") {
    sailings(where: { code: { eq: $code } }) { code status }
  }
  sailing_update(key: { code: $code }, data: { status: $status, updatedAt_expr: "request.time" })
  notified: _execute(sql: """
    INSERT INTO notification (id, owner_uid, title, message, category, created_at)
    SELECT gen_random_uuid(), owner_uid, 'Sailing status updated',
      'Sailing ' || $1 || ' is now ' || $2 || '. Check your booking for details.',
      'TRIP', now()
    FROM booking
    WHERE sailing_code = $1 AND status IN ('PENDING', 'CONFIRMED')
    GROUP BY owner_uid
  """, params: [$code, $status])
}

query AdminSailingBookings($code: String!) @auth(expr: "auth.token.role == 'ADMIN'") {
  bookings(where: { sailingCode: { eq: $code }, status: { in: ["PENDING", "CONFIRMED"] } }, limit: 1000) {
    id
    ownerUid
    passengerCount
    bookingChannel
  }
}

mutation AdminUpdateUnbookedSailing($code: String!, $originPortId: UUID!, $destinationPortId: UUID!, $vesselId: UUID!, $departureAt: Timestamp!, $arrivalAt: Timestamp!, $durationMinutes: Int!, $regularFare: Int!, $studentFare: Int!, $seniorFare: Int!, $childFare: Int!, $pwdFare: Int!) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && response.query.sailings[0].availableSeats == response.query.sailings[0].vessel.passengerCapacity && response.query.bookings.size() == 0 && response.query.ports.size() == 2 && response.query.vessels.size() == 1 && vars.originPortId != vars.destinationPortId && vars.departureAt > request.time && vars.arrivalAt > vars.departureAt && vars.durationMinutes > 0 && vars.regularFare > 0 && vars.studentFare > 0 && vars.seniorFare > 0 && vars.childFare > 0 && vars.pwdFare > 0", message: "Only unbooked, pre-boarding sailings can change route, vessel, time, and fares.") {
    sailings(where: { code: { eq: $code }, status: { in: ["SCHEDULED", "DELAYED"] } }) { code availableSeats vessel { passengerCapacity } }
    bookings(where: { sailingCode: { eq: $code }, status: { in: ["PENDING", "CONFIRMED"] } }, limit: 1) { id }
    ports(where: { id: { in: [$originPortId, $destinationPortId] }, isActive: { eq: true } }) { id }
    vessels(where: { id: { eq: $vesselId }, isActive: { eq: true } }) { id passengerCapacity }
  }
  sailing_update(key: { code: $code }, data: {
    originPortId: $originPortId
    destinationPortId: $destinationPortId
    vesselId: $vesselId
    departureAt: $departureAt
    arrivalAt: $arrivalAt
    durationMinutes: $durationMinutes
    regularFare: $regularFare
    studentFare: $studentFare
    seniorFare: $seniorFare
    childFare: $childFare
    pwdFare: $pwdFare
    availableSeats_expr: "response.query.vessels[0].passengerCapacity"
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "Sailing could not be updated.")
}

mutation AdminRescheduleSailing($code: String!, $departureAt: Timestamp!, $arrivalAt: Timestamp!, $durationMinutes: Int!) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && (response.query.sailings[0].departureAt != vars.departureAt || response.query.sailings[0].arrivalAt != vars.arrivalAt) && vars.departureAt > request.time && vars.arrivalAt > vars.departureAt && vars.durationMinutes > 0", message: "Only pre-boarding sailings can be rescheduled to a different future time.") {
    sailings(where: { code: { eq: $code }, status: { in: ["SCHEDULED", "DELAYED"] } }) { code departureAt arrivalAt }
  }
  sailing_update(key: { code: $code }, data: { departureAt: $departureAt, arrivalAt: $arrivalAt, durationMinutes: $durationMinutes, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "Sailing could not be rescheduled.")
  notified: _execute(sql: """
    INSERT INTO notification (id, owner_uid, title, message, category, created_at)
    SELECT gen_random_uuid(), owner_uid, 'Sailing rescheduled',
      'Sailing ' || $1 || ' now departs ' || to_char($2::timestamptz AT TIME ZONE 'Asia/Manila', 'Mon DD, YYYY HH12:MI AM') || '. Check your booking for the updated schedule.',
      'TRIP', now()
    FROM booking
    WHERE sailing_code = $1 AND status IN ('PENDING', 'CONFIRMED')
    GROUP BY owner_uid
  """, params: [$code, $departureAt])
}

mutation AdminCreateBooking($sailingCode: String!, $ownerUid: String!, $reference: String!, $passengerName: String!, $passengerType: String!) @auth(expr: "auth.token.role == 'ADMIN'") @retired @transaction {
  query @check(expr: "response.query.sailings.size() == 1 && response.query.users.size() == 1", message: "Choose an active sailing and passenger account.") {
    sailings(where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" }, availableSeats: { ge: 1 } }) {
      regularFare
      studentFare
      seniorFare
      childFare
      pwdFare
    }
    users(where: { uid: { eq: $ownerUid }, role: { eq: "PASSENGER" } }) { uid }
  }
  sailing_update(
    first: { where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" }, availableSeats: { ge: 1 } } }
    data: { availableSeats_update: { dec: 1 }, updatedAt_expr: "request.time" }
  )
    @check(expr: "this != null", message: "This sailing no longer has an available seat.")
  booking_insert(data: {
    reference: $reference
    ownerUid: $ownerUid
    sailingCode: $sailingCode
    status: "PENDING"
    passengerCount: 1
    serviceFee: 0
    passengerFareTotal_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
    total_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
  passenger: bookingPassenger_insert(data: {
    bookingId_expr: "response.booking_insert.id"
    fullName: $passengerName
    passengerType: $passengerType
    fare_expr: "vars.passengerType == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passengerType == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passengerType == 'CHILD' ? response.query.sailings[0].childFare : vars.passengerType == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
  notification_insert(data: { ownerUid: $ownerUid title: "Reservation awaiting payment" message: "Your seat is reserved. Pay at the ticketing desk to receive an e-ticket." category: "BOOKING" })
}

mutation AdminCancelBooking($bookingId: UUID!, $sailingCode: String!, $passengerCount: Int!) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @check(expr: "response.query.bookings.size() == 1 && (response.query.bookings[0].status == 'PENDING' || response.query.bookings[0].status == 'CONFIRMED') && response.query.bookings[0].paymentStatus == 'UNPAID' && response.query.bookings[0].passengerCount == vars.passengerCount && response.query.sailings.size() == 1 && response.query.sailings[0].departureAt > request.time", message: "Only unpaid bookings before departure can be cancelled here.") {
    bookings(where: { id: { eq: $bookingId }, sailingCode: { eq: $sailingCode } }) { status paymentStatus passengerCount }
    sailings(where: { code: { eq: $sailingCode } }) { code departureAt }
  }
  booking_update(
    first: { where: { id: { eq: $bookingId }, status: { in: ["PENDING", "CONFIRMED"] }, paymentStatus: { eq: "UNPAID" } } }
    data: { status: "CANCELLED", updatedAt_expr: "request.time" }
  )
    @check(expr: "this != null", message: "This booking has already been cancelled or changed.")
  sailing_update(key: { code: $sailingCode }, data: { availableSeats_update: { inc: $passengerCount }, updatedAt_expr: "request.time" })
}
