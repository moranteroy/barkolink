query AdminNextTripCode @auth(expr: "auth.token.role == 'ADMIN'") {
  nextTripCode: _selectFirst(sql: """
    WITH day AS (
      SELECT to_char(current_timestamp AT TIME ZONE 'Asia/Manila', '"TRP"YYYY-MMDD') AS prefix
    ), numbered AS (
      SELECT day.prefix, COALESCE(MAX(substring(s.code FROM 13)::bigint), 0) + 1 AS next_number
      FROM day LEFT JOIN sailing s ON s.code ~ ('^' || day.prefix || '[0-9]{3,}$')
      GROUP BY day.prefix
    )
    SELECT prefix || CASE WHEN next_number < 1000 THEN lpad(next_number::text, 3, '0') ELSE next_number::text END AS code
    FROM numbered
  """)
}
