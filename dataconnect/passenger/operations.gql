query BrowseActivePorts @auth(level: PUBLIC, insecureReason: "Active port names are public so passengers can plan a trip before signing in.") {
  ports(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }], limit: 100) {
    id
    code
    name
    city
  }
}

query BrowseSailings @auth(level: PUBLIC, insecureReason: "Sailing schedules and fares are public so passengers can search before signing in.") {
  sailings(where: { status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" } }, orderBy: [{ departureAt: ASC }], limit: 50) {
    code
    departureAt
    arrivalAt
    durationMinutes
    regularFare
    studentFare
    seniorFare
    childFare
    pwdFare
    availableSeats
    status
    origin { id code name city }
    destination { id code name city }
    vessel { id code name passengerCapacity }
  }
}

query MyProfile @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    email
    fullName
    phone
    role
  }
}

mutation CreateMyProfile($email: String!, $fullName: String!, $phone: String) @auth(level: USER) {
  user_insert(data: {
    uid_expr: "auth.uid"
    email: $email
    fullName: $fullName
    phone: $phone
    role: "PASSENGER"
  })
}

mutation UpdateMyProfile($fullName: String!, $phone: String) @auth(level: USER) {
  user_update(
    key: { uid_expr: "auth.uid" }
    data: { fullName: $fullName, phone: $phone, updatedAt_expr: "request.time" }
  )
}

query MyBookings @auth(level: USER) {
  bookings(where: { ownerUid: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id
    reference
    status
    passengerCount
    passengerFareTotal
    serviceFee
    paymentStatus
    paymentMethod
    paidAt
    bookingChannel
    total
    currency
    createdAt
    sailing {
      code
      departureAt
      arrivalAt
      origin { name city }
      destination { name city }
      vessel { name }
    }
    bookingPassengers_on_booking {
      id
      fullName
      passengerType
      fare
      ticketCode
      ticketStatus
      issuedAt
      checkedInAt
      boardedAt
    }
  }
}

mutation ReserveSailing1($sailingCode: String!, $reference: String!, $passenger1Name: String!, $passenger1Type: String!, $passenger1BirthDate: Date, $passenger1Sex: String, $passenger1Phone: String, $passenger1Nationality: String) @auth(level: USER) @transaction {
  query @check(expr: "response.query.sailings.size() == 1", message: "This sailing is no longer available.") {
    sailings(where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, departureAt: { gt_expr: "request.time" } }) { regularFare studentFare seniorFare childFare pwdFare }
  }
  sailing_update(
    first: { where: { code: { eq: $sailingCode }, status: { eq: "SCHEDULED" }, availableSeats: { ge: 1 }, departureAt: { gt_expr: "request.time" } } }
    data: { availableSeats_update: { dec: 1 }, updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "This sailing no longer has enough available seats.")
  booking_insert(data: {
    reference: $reference
    ownerUid_expr: "auth.uid"
    sailingCode: $sailingCode
    status: "PENDING"
    passengerCount: 1
    passengerFareTotal_expr: "(vars.passenger1Type == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passenger1Type == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passenger1Type == 'CHILD' ? response.query.sailings[0].childFare : vars.passenger1Type == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare)"
    total_expr: "(vars.passenger1Type == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passenger1Type == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passenger1Type == 'CHILD' ? response.query.sailings[0].childFare : vars.passenger1Type == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare)"
  })
  notification_insert(data: {
    ownerUid_expr: "auth.uid"
    title: "Reservation awaiting payment"
    message: "Your seat is reserved. Pay at the ticketing desk to receive your e-ticket."
    category: "BOOKING"
  })
  passenger1: bookingPassenger_insert(data: {
    bookingId_expr: "response.booking_insert.id"
    fullName: $passenger1Name
    passengerType: $passenger1Type
    birthDate: $passenger1BirthDate
    sex: $passenger1Sex
    phone: $passenger1Phone
    nationality: $passenger1Nationality
    fare_expr: "vars.passenger1Type == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passenger1Type == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passenger1Type == 'CHILD' ? response.query.sailings[0].childFare : vars.passenger1Type == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
}

