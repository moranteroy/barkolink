    fare_expr: "vars.passenger8Type == 'STUDENT' ? response.query.sailings[0].studentFare : vars.passenger8Type == 'SENIOR' ? response.query.sailings[0].seniorFare : vars.passenger8Type == 'CHILD' ? response.query.sailings[0].childFare : vars.passenger8Type == 'PWD' ? response.query.sailings[0].pwdFare : response.query.sailings[0].regularFare"
  })
}

mutation CancelMyBooking($id: UUID!, $sailingCode: String!, $passengerCount: Int!) @auth(level: USER) @transaction {
  query @check(
    expr: "response.query.bookings.size() == 1 && (response.query.bookings[0].status == 'PENDING' || response.query.bookings[0].status == 'CONFIRMED') && response.query.bookings[0].paymentStatus == 'UNPAID' && response.query.bookings[0].sailingCode == vars.sailingCode && response.query.bookings[0].passengerCount == vars.passengerCount && response.query.sailings.size() == 1"
    message: "This reservation cannot be cancelled."
  ) {
    bookings(where: { id: { eq: $id }, ownerUid: { eq_expr: "auth.uid" } }) {
      status
      paymentStatus
      sailingCode
      passengerCount
    }
    sailings(where: { code: { eq: $sailingCode }, departureAt: { gt_expr: "request.time" } }) {
      availableSeats
    }
  }
  booking_update(
    first: { where: { id: { eq: $id }, ownerUid: { eq_expr: "auth.uid" }, status: { in: ["PENDING", "CONFIRMED"] }, paymentStatus: { eq: "UNPAID" } } }
    data: { status: "CANCELLED", updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "This reservation is already cancelled.")
  sailing_update(
    key: { code: $sailingCode }
    data: { availableSeats_update: { inc: $passengerCount }, updatedAt_expr: "request.time" }
  )
  notification_insert(data: {
    ownerUid_expr: "auth.uid"
    title: "Reservation cancelled"
    message: "Your ferry reservation was cancelled. The seats are available again."
    category: "BOOKING"
  })
}

query MyNotifications @auth(level: USER) {
  notifications(where: { ownerUid: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }], limit: 50) {
    id
    title
    message
    category
    readAt
    createdAt
  }
}

query MyTickets @auth(level: USER) {
  bookingPassengers(where: { booking: { ownerUid: { eq_expr: "auth.uid" } } }) {
    id
    ticketCode
    ticketStatus
    issuedAt
    checkedInAt
    boardedAt
    fullName
    passengerType
    booking {
      reference
      sailing {
        code
        departureAt
        arrivalAt
        origin { name }
        destination { name }
        vessel { name }
      }
    }
  }
}

mutation MarkNotificationRead($id: UUID!) @auth(level: USER) {
  notification_update(
    first: { where: { id: { eq: $id }, ownerUid: { eq_expr: "auth.uid" } } }
    data: { readAt_expr: "request.time" }
  )
}
